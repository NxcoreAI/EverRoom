name: Windows app CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: windows-app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Run tests
        id: tests
        continue-on-error: true
        run: pnpm test:ci

      - name: Build gateway and desktop
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Report failed checks
        if: always() && (steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure')
        shell: pwsh
        run: throw 'One or more verification checks failed; see the individual steps above.'
