name: Windows app CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Configure private git credentials
        shell: bash
        env:
          VYITEC_USER: ${{ secrets.VYITEC_USER }}
          VYITEC_TOKEN: ${{ secrets.VYITEC_TOKEN }}
        run: |
          # 用 URL 重写注入凭证（insteadOf）：任何 git 调用（含 pnpm spawn 的
          # clone）访问 code.vyitec.com 时自动改写为带凭证的 URL。不走
          # credential helper——Windows runner 预置的 GCM 会抢跑且在无交互
          # 环境弹窗失败，helper 链行为在三个平台不可控。
          printf 'https://%s:%s@code.vyitec.com' "$VYITEC_USER" "$VYITEC_TOKEN" > "$RUNNER_TEMP/vyitec-url"
          git config --global url."$(cat "$RUNNER_TEMP/vyitec-url")/".insteadOf "https://code.vyitec.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:ci

      - name: Build gateway and desktop
        env:
          SENTRY_AUTH_TOKEN: ""
        run: |
          pnpm --filter @nxcore/gateway build
          pnpm --filter @nxcore/desktop exec electron-vite build
