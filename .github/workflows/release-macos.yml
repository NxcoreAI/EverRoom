name: Release macOS app

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release tag
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          test "$GITHUB_REF_NAME" = "desktop-v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match desktop version $version" >&2
            exit 1
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tagged commit must be on main" >&2
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build gateway and desktop
        run: pnpm build

      - name: Package macOS arm64
        run: pnpm --filter @nxcore/desktop exec electron-builder --mac dmg zip --arm64 --publish never

      - name: Audit package contents
        shell: bash
        run: |
          app_path="$(find release -type d -name EverRoom.app -print -quit)"
          test -n "$app_path" || { echo "EverRoom.app was not produced" >&2; exit 1; }
          resources="$app_path/Contents/Resources"
          forbidden='(^|/)(\.env($|\.)|(__tests__|tests?)(/|$)|[^/]*(\.test|\.spec)\.[^/]+$|(test|spec)\.[^/]+$)|\.(map|ts|tsx|mts|cts)$'

          loose_files="$(find "$resources" -type f -print)"
          if printf '%s\n' "$loose_files" | grep -Eiq "$forbidden"; then
            printf '%s\n' "$loose_files" | grep -Ei "$forbidden" >&2
            exit 1
          fi

          asar_path="$(cd "$resources" && pwd)/app.asar"
          pnpm --filter @nxcore/desktop exec asar list "$asar_path" > "$RUNNER_TEMP/asar-files.txt"
          if grep -Eiq "$forbidden" "$RUNNER_TEMP/asar-files.txt"; then
            grep -Ei "$forbidden" "$RUNNER_TEMP/asar-files.txt" >&2
            exit 1
          fi

      - name: Verify artifacts
        shell: bash
        run: |
          app_path="$(find release -type d -name EverRoom.app -print -quit)"
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          test "${#dmgs[@]}" -eq 1 && test -f "${dmgs[0]}" || { echo "Expected one DMG" >&2; exit 1; }
          test "${#zips[@]}" -eq 1 && test -f "${zips[0]}" || { echo "Expected one ZIP" >&2; exit 1; }
          test "$(lipo -archs "$app_path/Contents/MacOS/EverRoom")" = "arm64"
          test -f "$app_path/Contents/Resources/gateway/node_modules/better-sqlite3/prebuilds/darwin-arm64.node"
          hdiutil verify "${dmgs[0]}"
          unzip -t "${zips[0]}"

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes "Unsigned Apple Silicon development build. macOS may require manual approval before first launch."
