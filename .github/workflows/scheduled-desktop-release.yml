name: Daily desktop release check

on:
  schedule:
    # 00:00 Asia/Shanghai (UTC+8). GitHub schedules use UTC.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: daily-desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      NXCORE_SAAS_API_URL: ${{ vars.NXCORE_SAAS_API_URL }}
      NXCORE_KNOWLEDGE_ROUTER_ENABLED: ${{ vars.NXCORE_KNOWLEDGE_ROUTER_ENABLED }}
      NXCORE_KNOWLEDGE_INGEST_DEBOUNCE_MS: ${{ vars.NXCORE_KNOWLEDGE_INGEST_DEBOUNCE_MS }}
      NXCORE_CONNECTOR_POLL_MS: ${{ vars.NXCORE_CONNECTOR_POLL_MS }}
      NXCORE_INGEST_FILTER_ENABLED: ${{ vars.NXCORE_INGEST_FILTER_ENABLED }}
      NXCORE_INGEST_FILTER_MODE: ${{ vars.NXCORE_INGEST_FILTER_MODE }}
      NXCORE_NANGO_URL: ${{ secrets.NXCORE_NANGO_URL }}
      NXCORE_NANGO_GMAIL_CONFIG_KEY: ${{ secrets.NXCORE_NANGO_GMAIL_CONFIG_KEY }}
      NXCORE_NANGO_GOOGLE_CLIENT_ID: ${{ secrets.NXCORE_NANGO_GOOGLE_CLIENT_ID }}
      NXCORE_NANGO_GOOGLE_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_GOOGLE_CLIENT_SECRET }}
      NXCORE_NANGO_NOTION_CLIENT_ID: ${{ secrets.NXCORE_NANGO_NOTION_CLIENT_ID }}
      NXCORE_NANGO_NOTION_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_NOTION_CLIENT_SECRET }}
      NXCORE_NANGO_OUTLOOK_CLIENT_ID: ${{ secrets.NXCORE_NANGO_OUTLOOK_CLIENT_ID }}
      NXCORE_NANGO_OUTLOOK_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_OUTLOOK_CLIENT_SECRET }}
      NXCORE_NANGO_OUTLOOK_CONFIG_KEY: ${{ secrets.NXCORE_NANGO_OUTLOOK_CONFIG_KEY }}

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect release candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Desktop version $version must match X.Y.Z" >&2
            exit 1
          }
          git fetch origin 'refs/tags/desktop-v*:refs/tags/desktop-v*'
          tag="$(git tag --points-at HEAD --list "desktop-v$version*" --sort=-version:refname | head -n 1)"
          if [[ -n "$tag" ]]; then
            echo "tag-exists=true" >> "$GITHUB_OUTPUT"
          else
            tag="desktop-v$version-nightly.$(TZ=Asia/Shanghai date +%Y%m%d).$GITHUB_RUN_NUMBER"
            echo "tag-exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "Commit $(git rev-parse --short HEAD) is already published as $tag."
            exit 0
          fi

          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.candidate.outputs.pending == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        if: steps.candidate.outputs.pending == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.candidate.outputs.pending == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check types
        if: steps.candidate.outputs.pending == 'true'
        run: pnpm typecheck

      - name: Build gateway and desktop
        if: steps.candidate.outputs.pending == 'true'
        run: pnpm build

      - name: Create release tag
        if: steps.candidate.outputs.pending == 'true' && steps.candidate.outputs.tag-exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$RELEASE_SHA" >/dev/null

      - name: Trigger desktop release
        if: steps.candidate.outputs.pending == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run release-desktop.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Notify Feishu when preflight fails
        if: failure()
        shell: bash
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
        run: |
          if [[ -z "$FEISHU_WEBHOOK_URL" ]]; then
            echo "::warning::FEISHU_RELEASE_WEBHOOK is not configured; skipping notification."
            exit 0
          fi
          message="EverRoom 每日发布检查失败
          分支：main
          提交：$(git log -1 --pretty='%h %s (%an)')
          日志：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n --arg text "$message" '{msg_type:"text",content:{text:$text}}')"
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$FEISHU_WEBHOOK_URL" >/dev/null
