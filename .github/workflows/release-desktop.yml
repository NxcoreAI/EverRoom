name: Release desktop app

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 || secrets.MAC_CERTS }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.MAC_CERTS_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NXCORE_AGENT_RUNTIME: ${{ vars.NXCORE_AGENT_RUNTIME }}
      NXCORE_SAAS_API_URL: ${{ vars.NXCORE_SAAS_API_URL }}
      NXCORE_CONNECTOR_POLL_MS: ${{ vars.NXCORE_CONNECTOR_POLL_MS }}
      NXCORE_NANGO_URL: ${{ secrets.NXCORE_NANGO_URL }}
      NXCORE_NANGO_SECRET: ${{ secrets.NXCORE_NANGO_SECRET }}
      NXCORE_NANGO_GMAIL_CONFIG_KEY: ${{ secrets.NXCORE_NANGO_GMAIL_CONFIG_KEY }}
      NXCORE_NANGO_GOOGLE_CLIENT_ID: ${{ secrets.NXCORE_NANGO_GOOGLE_CLIENT_ID }}
      NXCORE_NANGO_GOOGLE_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_GOOGLE_CLIENT_SECRET }}
      NXCORE_NANGO_NOTION_CLIENT_ID: ${{ secrets.NXCORE_NANGO_NOTION_CLIENT_ID }}
      NXCORE_NANGO_NOTION_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_NOTION_CLIENT_SECRET }}
      NXCORE_NANGO_OUTLOOK_CLIENT_ID: ${{ secrets.NXCORE_NANGO_OUTLOOK_CLIENT_ID }}
      NXCORE_NANGO_OUTLOOK_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_OUTLOOK_CLIENT_SECRET }}
      NXCORE_NANGO_OUTLOOK_CONFIG_KEY: ${{ secrets.NXCORE_NANGO_OUTLOOK_CONFIG_KEY }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Derive update channel from tag
        shell: bash
        run: |
          # nightly tag 构建把渠道烙进 packaged-env（客户端据此查 nightly feed）；
          # stable 不设该变量，运行时默认 stable。
          if [[ "$GITHUB_REF_NAME" =~ -nightly\. ]]; then
            echo "NXCORE_UPDATE_CHANNEL=nightly" >> "$GITHUB_ENV"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release tag
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [[ "$GITHUB_REF_NAME" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+)(-nightly\.[0-9]{8}\.[0-9]+)?$ ]] || {
            echo "Tag $GITHUB_REF_NAME is not a desktop release tag" >&2
            exit 1
          }
          test "${BASH_REMATCH[1]}" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match desktop version $version" >&2
            exit 1
          }
          git fetch origin main dev alpha --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            git merge-base --is-ancestor "$GITHUB_SHA" origin/dev ||
            git merge-base --is-ancestor "$GITHUB_SHA" origin/alpha || {
            echo "Tagged commit must be on main, dev, or alpha" >&2
            exit 1
          }

      - name: Configure private git credentials
        shell: bash
        env:
          VYITEC_USER: ${{ secrets.VYITEC_USER }}
          VYITEC_TOKEN: ${{ secrets.VYITEC_TOKEN }}
        run: |
          # 用 URL 重写注入凭证（insteadOf）：任何 git 调用（含 pnpm spawn 的
          # clone）访问 code.vyitec.com 时自动改写为带凭证的 URL。不走
          # credential helper——Windows runner 预置的 GCM 会抢跑且在无交互
          # 环境弹窗失败，helper 链行为在三个平台不可控。
          printf 'https://%s:%s@code.vyitec.com' "$VYITEC_USER" "$VYITEC_TOKEN" > "$RUNNER_TEMP/vyitec-url"
          git config --global url."$(cat "$RUNNER_TEMP/vyitec-url")/".insteadOf "https://code.vyitec.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tarball cache for the `npm ci` run inside prepare-genoffice-runtime.mjs
      # (genoffice submodule). The pnpm store above only covers pnpm installs.
      - name: Cache npm tarballs for submodule builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-tarballs-${{ runner.os }}-${{ hashFiles('apps/desktop/vendor/genoffice/package-lock.json') }}
          restore-keys: npm-tarballs-${{ runner.os }}-

      # prepare-genoffice-runtime.mjs builds the Rust xlsx sidecar (cargo
      # build --release); rust-cache covers the registry and target dir.
      - name: Cache Rust build for xlsx sidecar
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: apps/desktop/vendor/genoffice/apps/sheets/native/xlsx-engine

      - name: Check types
        run: pnpm typecheck

      - name: Prepare macOS signing assets
        shell: bash
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            echo "::warning::macOS signing certificate is not configured; producing an unsigned build."
            exit 0
          fi
          : "${CSC_KEY_PASSWORD:?secret MACOS_CERTIFICATE_PASSWORD is not set}"
          # notarize 只要签名就必走，API Key 装配与 profile 无关，必须在 profile 提前退出之前。
          : "${APPLE_API_KEY_BASE64:?secret APPLE_API_KEY_BASE64 is not set}"
          : "${APPLE_API_KEY_ID:?secret APPLE_API_KEY_ID is not set}"
          : "${APPLE_API_ISSUER:?secret APPLE_API_ISSUER is not set}"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          # Apple API key 三重校验：BSD base64 对非法输入不报错（静默丢字符），
          # 坏 secret 若不在此处拦截，会在 20 分钟构建后的 notarize 阶段才以
          # "invalidPrivateKeyContents" 死掉（notarytool 本地解析 .p8 失败，
          # 错误非 JSON，被 @electron/notarize 包装成 unexpected result）。
          # 1) strict base64 roundtrip；2) PEM 结构；3) openssl pkey 可解析。
          # 常见错误形态：secret 里存了 PEM 原文或双重 base64。
          fail_fast() { echo "::error::$1" >&2; exit 1; }
          base64 -i "$RUNNER_TEMP/AuthKey.p8" | tr -d '\n' > "$RUNNER_TEMP/rt.b64"
          printf '%s' "$APPLE_API_KEY_BASE64" | tr -d '\n' > "$RUNNER_TEMP/given.b64"
          cmp -s "$RUNNER_TEMP/rt.b64" "$RUNNER_TEMP/given.b64" ||
            fail_fast "APPLE_API_KEY_BASE64 is not valid strict base64 (decode silently dropped characters). Store base64 of the .p8 file, not the PEM text or double-encoded base64."
          grep -q '^-----BEGIN PRIVATE KEY-----' "$RUNNER_TEMP/AuthKey.p8" ||
            fail_fast "Decoded APPLE_API_KEY_BASE64 is not a PEM private key document."
          grep -q '^-----END PRIVATE KEY-----' "$RUNNER_TEMP/AuthKey.p8" ||
            fail_fast "Decoded APPLE_API_KEY_BASE64 has no PEM END line."
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout 2>/dev/null ||
            fail_fast "Decoded APPLE_API_KEY_BASE64 is not a parseable PKCS#8 private key (App Store Connect API keys are EC P-256 PKCS#8)."
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          if [[ -z "$MACOS_PROVISIONING_PROFILE_BASE64" ]]; then
            echo "::warning::APNs provisioning profile is not configured; push entitlements will not be verified."
            exit 0
          fi
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > apps/desktop/build/embedded.provisionprofile
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/everroom-profile.plist" | grep -E '^.+\.ai\.nxcore\.everoffice$'
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.aps-environment' "$RUNNER_TEMP/everroom-profile.plist" | grep -Fx production

      - name: Build app and bundled runtimes
        run: |
          pnpm build
          pnpm --filter @nxcore/desktop exec node scripts/prepare-open-connector.mjs
          pnpm --filter @nxcore/desktop exec node scripts/prepare-oo-cli.mjs
          pnpm --filter @nxcore/desktop exec node scripts/prepare-lark-cli.mjs
          pnpm --filter @nxcore/desktop exec node scripts/prepare-ntn.mjs
          pnpm --filter @nxcore/desktop exec node scripts/prepare-acp-adapters.mjs
          pnpm --filter @nxcore/desktop exec node scripts/generate-packaged-env.mjs

      - name: Package macOS arm64
        shell: bash
        run: |
          # osx-sign walks the whole .app with unbounded concurrency; default
          # 256 fd limit on runners causes EMFILE on the bundled node_modules.
          ulimit -n 10240
          args=()
          if [[ -n "$CSC_LINK" ]]; then
            args+=(--config.mac.notarize=true --config.mac.hardenedRuntime=true)
            profile="apps/desktop/build/embedded.provisionprofile"
            if [[ -f "$profile" ]]; then
              # Absolute path: osx-sign passes it verbatim to `security cms`,
              # which resolves relative paths against its own cwd.
              args+=("--config.mac.provisioningProfile=$(pwd)/$profile")
            else
              # Without a profile, aps-environment is an unauthorized restricted
              # entitlement and AMFI kills the app at launch. Ship without push.
              # plist 里该键当前本就不存在（App Store 分发时才补回），Delete 需容忍缺席。
              /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.aps-environment' apps/desktop/build/entitlements.mac.plist 2>/dev/null || true
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # 与 windows job 一致：产物文件名用 tag 完整版本号（nightly 可区分）。
          full_version="${GITHUB_REF_NAME#desktop-v}"
          pnpm --filter @nxcore/desktop exec electron-builder --mac dmg zip --arm64 --publish never \
            --config.mac.artifactName="\${productName}-${full_version}-\${arch}.\${ext}" \
            --config.extraMetadata.version="$full_version" "${args[@]}"

      - name: Audit package contents
        shell: bash
        run: |
          app_path="$(find release -type d -name EverOffice.app -print -quit)"
          test -n "$app_path" || { echo "EverOffice.app was not produced" >&2; exit 1; }
          resources="$app_path/Contents/Resources"
          forbidden='(^|/)(\.env($|\.)|(__tests__|tests?)(/|$)|[^/]*(\.test|\.spec)\.[^/]+$|(test|spec)\.[^/]+$)|\.map$'

          loose_files="$(find "$resources" -type f -print)"
          if printf '%s\n' "$loose_files" | grep -Eiq "$forbidden"; then
            printf '%s\n' "$loose_files" | grep -Ei "$forbidden" >&2
            exit 1
          fi
          unexpected_typescript="$(printf '%s\n' "$loose_files" | grep -Ei '\.(ts|tsx|mts|cts)$' | grep -Ev "^$resources/open-connector/" || true)"
          test -z "$unexpected_typescript" || { printf '%s\n' "$unexpected_typescript" >&2; exit 1; }

          # 四件套运行时 + ACP 适配器必须在包内：缺失说明 prepare 脚本没跑或
          # extraResources 源目录不存在（electron-builder 会静默跳过），装出去
          # 导出/连接器/本机 Agent 直接废。
          for dir in open-connector oo lark-cli ntn acp-adapters; do
            test -d "$resources/$dir" || { echo "missing bundled runtime: $resources/$dir" >&2; exit 1; }
          done
          # 内置 ACP 适配器清单（claude/codex）必须落包：目录在而包不在说明
          # prepare-acp-adapters.mjs 半途而废，开箱即用的兜底就没了。
          for adapter_manifest in \
            "$resources/acp-adapters/claude/node_modules/@zed-industries/claude-agent-acp/package.json" \
            "$resources/acp-adapters/codex/node_modules/@agentclientprotocol/codex-acp/package.json"; do
            test -f "$adapter_manifest" || { echo "missing bundled ACP adapter: $adapter_manifest" >&2; exit 1; }
          done

          asar_path="$(cd "$resources" && pwd)/app.asar"
          pnpm --filter @nxcore/desktop exec asar list "$asar_path" > "$RUNNER_TEMP/asar-files.txt"
          if grep -Eiq "$forbidden" "$RUNNER_TEMP/asar-files.txt"; then
            grep -Ei "$forbidden" "$RUNNER_TEMP/asar-files.txt" >&2
            exit 1
          fi
          unexpected_typescript="$(grep -Ei '\.(ts|tsx|mts|cts)$' "$RUNNER_TEMP/asar-files.txt" || true)"
          test -z "$unexpected_typescript" || { printf '%s\n' "$unexpected_typescript" >&2; exit 1; }

          # 全部 test 均带失败输出：静默退出会让日志看不出挂的是哪一项。
          test -x "$resources/app.asar.unpacked/node_modules/@esbuild/darwin-arm64/bin/esbuild" \
            || { echo "missing asar-unpacked @esbuild/darwin-arm64 (desktop optionalDependencies 未入包?)" >&2; exit 1; }
          test -f "$resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/darwin-arm64.node" \
            || { echo "missing asar-unpacked better-sqlite3 darwin-arm64 prebuild" >&2; exit 1; }
          test -f "$resources/open-connector/src/server/index.ts" \
            || { echo "missing open-connector TS entry" >&2; exit 1; }
          test -f "$resources/open-connector/dist/web/index.html" \
            || { echo "missing open-connector web dist" >&2; exit 1; }
          test -x "$resources/oo/darwin-arm64/oo" \
            || { echo "missing oo darwin-arm64 binary" >&2; exit 1; }
          "$resources/oo/darwin-arm64/oo" --version

      - name: Verify artifacts
        shell: bash
        run: |
          app_path="$(find release -type d -name EverOffice.app -print -quit)"
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          test "${#dmgs[@]}" -eq 1 && test -f "${dmgs[0]}" || { echo "Expected one DMG" >&2; exit 1; }
          test "${#zips[@]}" -eq 1 && test -f "${zips[0]}" || { echo "Expected one ZIP" >&2; exit 1; }
          test "$(lipo -archs "$app_path/Contents/MacOS/EverOffice")" = "arm64" \
            || { echo "unexpected archs in EverOffice binary" >&2; exit 1; }
          test -f "$app_path/Contents/Resources/gateway/node_modules/better-sqlite3/prebuilds/darwin-arm64.node" \
            || { echo "missing gateway better-sqlite3 darwin-arm64 prebuild" >&2; exit 1; }
          hdiutil verify "${dmgs[0]}"
          unzip -t "${zips[0]}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-assets
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  windows:
    runs-on: windows-2025
    env:
      NXCORE_AGENT_RUNTIME: ${{ vars.NXCORE_AGENT_RUNTIME }}
      NXCORE_SAAS_API_URL: ${{ vars.NXCORE_SAAS_API_URL }}
      NXCORE_CONNECTOR_POLL_MS: ${{ vars.NXCORE_CONNECTOR_POLL_MS }}
      NXCORE_NANGO_URL: ${{ secrets.NXCORE_NANGO_URL }}
      NXCORE_NANGO_SECRET: ${{ secrets.NXCORE_NANGO_SECRET }}
      NXCORE_NANGO_GMAIL_CONFIG_KEY: ${{ secrets.NXCORE_NANGO_GMAIL_CONFIG_KEY }}
      NXCORE_NANGO_GOOGLE_CLIENT_ID: ${{ secrets.NXCORE_NANGO_GOOGLE_CLIENT_ID }}
      NXCORE_NANGO_GOOGLE_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_GOOGLE_CLIENT_SECRET }}
      NXCORE_NANGO_NOTION_CLIENT_ID: ${{ secrets.NXCORE_NANGO_NOTION_CLIENT_ID }}
      NXCORE_NANGO_NOTION_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_NOTION_CLIENT_SECRET }}
      NXCORE_NANGO_OUTLOOK_CLIENT_ID: ${{ secrets.NXCORE_NANGO_OUTLOOK_CLIENT_ID }}
      NXCORE_NANGO_OUTLOOK_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_OUTLOOK_CLIENT_SECRET }}
      NXCORE_NANGO_OUTLOOK_CONFIG_KEY: ${{ secrets.NXCORE_NANGO_OUTLOOK_CONFIG_KEY }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Derive update channel from tag
        shell: bash
        run: |
          # nightly tag 构建把渠道烙进 packaged-env（客户端据此查 nightly feed）；
          # stable 不设该变量，运行时默认 stable。
          if [[ "$GITHUB_REF_NAME" =~ -nightly\. ]]; then
            echo "NXCORE_UPDATE_CHANNEL=nightly" >> "$GITHUB_ENV"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release tag
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [[ "$GITHUB_REF_NAME" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+)(-nightly\.[0-9]{8}\.[0-9]+)?$ ]] || {
            echo "Tag $GITHUB_REF_NAME is not a desktop release tag" >&2
            exit 1
          }
          test "${BASH_REMATCH[1]}" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match desktop version $version" >&2
            exit 1
          }
          git fetch origin main dev alpha --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            git merge-base --is-ancestor "$GITHUB_SHA" origin/dev ||
            git merge-base --is-ancestor "$GITHUB_SHA" origin/alpha || {
            echo "Tagged commit must be on main, dev, or alpha" >&2
            exit 1
          }

      - name: Configure private git credentials
        shell: bash
        env:
          VYITEC_USER: ${{ secrets.VYITEC_USER }}
          VYITEC_TOKEN: ${{ secrets.VYITEC_TOKEN }}
        run: |
          # 用 URL 重写注入凭证（insteadOf）：任何 git 调用（含 pnpm spawn 的
          # clone）访问 code.vyitec.com 时自动改写为带凭证的 URL。不走
          # credential helper——Windows runner 预置的 GCM 会抢跑且在无交互
          # 环境弹窗失败，helper 链行为在三个平台不可控。
          printf 'https://%s:%s@code.vyitec.com' "$VYITEC_USER" "$VYITEC_TOKEN" > "$RUNNER_TEMP/vyitec-url"
          git config --global url."$(cat "$RUNNER_TEMP/vyitec-url")/".insteadOf "https://code.vyitec.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache npm tarballs for submodule builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-tarballs-${{ runner.os }}-${{ hashFiles('apps/desktop/vendor/genoffice/package-lock.json') }}
          restore-keys: npm-tarballs-${{ runner.os }}-

      - name: Cache Rust build for xlsx sidecar
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: apps/desktop/vendor/genoffice/apps/sheets/native/xlsx-engine

      - name: Check types
        run: pnpm typecheck

      - name: Build app and bundled runtimes
        shell: bash
        run: |
          pnpm build
          pnpm --filter @nxcore/desktop exec node scripts/prepare-open-connector.mjs
          pnpm --filter @nxcore/desktop exec node scripts/prepare-oo-cli.mjs
          pnpm --filter @nxcore/desktop exec node scripts/prepare-lark-cli.mjs
          pnpm --filter @nxcore/desktop exec node scripts/prepare-ntn.mjs
          pnpm --filter @nxcore/desktop exec node scripts/prepare-acp-adapters.mjs
          pnpm --filter @nxcore/desktop exec node scripts/generate-packaged-env.mjs

      - name: Package Windows x64
        shell: bash
        # npmRebuild=false: better-sqlite3 ships N-API prebuilds for every
        # platform, so no Electron-ABI rebuild is needed.
        # artifactName 与包内版本均用 tag 完整版本号（nightly 含 nightly.日期.序号）：
        # extraMetadata.version 让 app.getVersion() 返回完整版本，装上 nightly.N 后
        # 与 feed 版本相等即判无更新；次日 N+1 正常判更新。正式版 tag 无后缀，行为不变。
        run: |
          full_version="${GITHUB_REF_NAME#desktop-v}"
          pnpm --filter @nxcore/desktop exec electron-builder --win nsis --x64 --publish never --config.npmRebuild=false \
            --config.win.artifactName="\${productName}-${full_version}-windows-\${arch}.\${ext}" \
            --config.extraMetadata.version="$full_version"
          echo "EVERROOM_FULL_VERSION=$full_version" >> "$GITHUB_ENV"

      - name: Audit package contents
        shell: bash
        run: |
          pnpm --filter @nxcore/desktop exec node scripts/verify-windows-package.mjs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-assets
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-assets
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-assets
          path: release-assets

      - name: Publish desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 || secrets.MAC_CERTS }}
          PUSH_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # 资产名与打包侧 artifactName 一致：tag 完整版本号（nightly 含后缀）。
          version="${GITHUB_REF_NAME#desktop-v}"
          expected=(
            "release-assets/EverOffice-$version-arm64.dmg"
            "release-assets/EverOffice-$version-arm64.zip"
            "release-assets/EverOffice-$version-arm64.zip.blockmap"
            "release-assets/EverOffice-$version-windows-x64.exe"
            "release-assets/EverOffice-$version-windows-x64.exe.blockmap"
          )
          files=(release-assets/*)
          test "${#files[@]}" -eq "${#expected[@]}" || {
            printf 'Unexpected release assets:\n%s\n' "${files[*]}" >&2
            exit 1
          }
          for asset in "${expected[@]}"; do
            test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          if [[ -n "$SIGNING_CERTIFICATE" ]]; then
            notes="Signed and notarized Apple Silicon builds."
            if [[ -n "$PUSH_PROFILE" ]]; then
              notes="Signed and notarized Apple Silicon builds with macOS push notification support."
            fi
          else
            notes="Unsigned Apple Silicon development builds. macOS Gatekeeper may require manual approval before first launch."
          fi
          notes="$notes Windows x64 builds are unsigned; Microsoft Defender SmartScreen may warn before the first launch."
          release_flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-nightly.* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "${expected[@]}" \
            --verify-tag \
            "${release_flags[@]}" \
            --generate-notes \
            --notes "$notes"

      # 分发：产物传 OSS + 登记管理端（draft 状态，发布控制完全在管理台）。
      # 仅 tag 触发时执行；workflow_dispatch 走分支名时跳过。
      - name: Distribute to OSS and register release
        shell: bash
        env:
          OSS_ENDPOINT: ${{ vars.RELEASE_OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.RELEASE_OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.RELEASE_OSS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.RELEASE_OSS_KEY_SECRET }}
          RELEASE_API: ${{ vars.NXCORE_SAAS_API_URL }}
          RELEASE_CI_TOKEN: ${{ secrets.RELEASE_CI_TOKEN }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^desktop-v ]]; then
            echo "::notice::Not a desktop release tag, skipping distribution."
            exit 0
          fi
          for var in OSS_ENDPOINT OSS_BUCKET OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET RELEASE_API RELEASE_CI_TOKEN; do
            test -n "${!var}" || { echo "Missing env $var (check repo vars/secrets)" >&2; exit 1; }
          done
          version="${GITHUB_REF_NAME#desktop-v}"
          if [[ "$version" == *-nightly.* ]]; then channel=nightly; else channel=stable; fi
          echo "Distributing $version (channel=$channel)"

          # 阿里云 2026-09-20 下架了 CDN 上的 1.7.19（404，GitHub 上该 tag 也无资产），
          # 1.7.18 为最后可用版本；若再失效改用 GitHub aliyun/ossutil v1.7.18 release 资产。
          curl -fsSL -o "$RUNNER_TEMP/ossutil64" https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x "$RUNNER_TEMP/ossutil64"
          ossutil() { "$RUNNER_TEMP/ossutil64" "$@" -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"; }

          ossutil cp release-assets/ "oss://$OSS_BUCKET/archive/$version/" -r -f
          sha_exe=$(openssl dgst -sha512 -binary "release-assets/EverOffice-$version-windows-x64.exe" | base64 -w0)
          sha_zip=$(openssl dgst -sha512 -binary "release-assets/EverOffice-$version-arm64.zip" | base64 -w0)
          sha_dmg=$(openssl dgst -sha512 -binary "release-assets/EverOffice-$version-arm64.dmg" | base64 -w0)
          size_exe=$(stat -c%s "release-assets/EverOffice-$version-windows-x64.exe")
          size_zip=$(stat -c%s "release-assets/EverOffice-$version-arm64.zip")
          size_dmg=$(stat -c%s "release-assets/EverOffice-$version-arm64.dmg")

          jq -n --arg v "$version" --arg c "$channel" --arg sha "$GITHUB_SHA" \
            --arg exe "EverOffice-$version-windows-x64.exe" --argjson size_exe "$size_exe" --arg sha_exe "$sha_exe" \
            --arg zip "EverOffice-$version-arm64.zip" --argjson size_zip "$size_zip" --arg sha_zip "$sha_zip" \
            --arg dmg "EverOffice-$version-arm64.dmg" --argjson size_dmg "$size_dmg" --arg sha_dmg "$sha_dmg" \
            '{version:$v,channel:$c,commitSha:$sha,files:[
              {platform:"windows",fileName:$exe,fileSize:$size_exe,sha512Base64:$sha_exe},
              {platform:"macos",fileName:$zip,fileSize:$size_zip,sha512Base64:$sha_zip},
              {platform:"macos",fileName:$dmg,fileSize:$size_dmg,sha512Base64:$sha_dmg,isUpdateTarget:false}
            ]}' > "$RUNNER_TEMP/ci-register.json"

          # NXCORE_SAAS_API_URL 带不带 /api/v1 后缀都兼容（客户端侧有 normalize，脚本侧此前缺失导致 404）
          api_base="${RELEASE_API%/}"
          case "$api_base" in */api/v1) ;; *) api_base="$api_base/api/v1" ;; esac
          status=$(curl -s -o "$RUNNER_TEMP/register-resp.json" -w '%{http_code}' -X POST \
            -H "X-CI-Token: $RELEASE_CI_TOKEN" -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/ci-register.json" \
            "$api_base/releases/ci-register")
          test "$status" = "200" || {
            cat "$RUNNER_TEMP/register-resp.json" >&2
            echo "ci-register failed with HTTP $status" >&2
            exit 1
          }
          echo "Registered $version ($channel) as draft."

          # stable 渠道额外写一份无灰度直链 yml 到 OSS stable/，作为控制面
          # 故障时客户端的降级备源（客户端 feed 失败自动切到这里）。
          if [[ "$channel" = "stable" ]]; then
            public_base="https://$OSS_BUCKET.$OSS_ENDPOINT"
            # heredoc 内容与结束符压到脚本基础缩进层：Actions 会剥离公共缩进，
            # 结束符带前导空格则 bash 不认，heredoc 永不终止。
            cat > "$RUNNER_TEMP/latest.yml" <<YAML
          version: $version
          path: $public_base/archive/$version/EverOffice-$version-windows-x64.exe
          sha512: $sha_exe
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          releaseName: '$version'
          YAML
            cat > "$RUNNER_TEMP/latest-mac.yml" <<YAML
          version: $version
          files:
            - url: $public_base/archive/$version/EverOffice-$version-arm64.zip
              sha512: $sha_zip
          sha512: $sha_zip
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          releaseName: '$version'
          YAML
            ossutil cp "$RUNNER_TEMP/latest.yml" "oss://$OSS_BUCKET/stable/latest.yml" -f
            ossutil cp "$RUNNER_TEMP/latest-mac.yml" "oss://$OSS_BUCKET/stable/latest-mac.yml" -f
            echo "Stable fallback feed updated."
          fi

  notify:
    needs: [macos, windows, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect release summary
        id: summary
        shell: bash
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          # 完整版本号（nightly 含后缀）：产物下载 URL 与打包文件名一致。
          version="${GITHUB_REF_NAME#desktop-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          previous_tag="$(git describe --tags --match 'desktop-v*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commits="$(git log --no-merges --pretty='- %h %s (%an)' "$previous_tag..$GITHUB_SHA" -n 10)"
          else
            commits="$(git log --no-merges --pretty='- %h %s (%an)' "$GITHUB_SHA" -n 10)"
          fi
          [[ -n "$commits" ]] || commits="- 本版本仅包含合并提交"
          {
            echo "commits<<RELEASE_COMMITS_EOF"
            echo "$commits"
            echo "RELEASE_COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

          repo_url="https://github.com/$GITHUB_REPOSITORY"
          if [[ "$PUBLISH_RESULT" == "success" ]]; then
            buttons="$(jq -nc --arg dmg "$repo_url/releases/download/$GITHUB_REF_NAME/EverOffice-$version-arm64.dmg" \
              --arg exe "$repo_url/releases/download/$GITHUB_REF_NAME/EverOffice-$version-windows-x64.exe" \
              --arg rel "$repo_url/releases/tag/$GITHUB_REF_NAME" '[
                {text:"⬇ macOS .dmg", url:$dmg, type:"default"},
                {text:"⬇ Windows .exe", url:$exe, type:"default"},
                {text:"查看 Release", url:$rel, type:"primary"}
              ]')"
          else
            buttons="$(jq -nc --arg log "$repo_url/actions/runs/$GITHUB_RUN_ID" '[
              {text:"查看构建日志", url:$log, type:"primary"}
            ]')"
          fi
          echo "buttons=$buttons" >> "$GITHUB_OUTPUT"

      - name: Notify Feishu (success)
        if: needs.publish.result == 'success'
        uses: ./.github/actions/feishu-card
        with:
          webhook-url: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          template: green
          title: 🚀 ${{ github.ref_name }} 发布成功
          body: |
            **自上版以来的提交：**
            ${{ steps.summary.outputs.commits }}
          buttons: ${{ steps.summary.outputs.buttons }}
          note: ${{ github.repository }}

      - name: Notify Feishu (failure)
        if: needs.publish.result != 'success'
        uses: ./.github/actions/feishu-card
        with:
          webhook-url: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          template: red
          title: 🚀 ${{ github.ref_name }} 发布失败
          body: |
            构建或发布未成功，请查看日志排查。

            **涉及的提交：**
            ${{ steps.summary.outputs.commits }}
          buttons: ${{ steps.summary.outputs.buttons }}
          note: ${{ github.repository }}
