name: Release desktop app

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 || secrets.MAC_CERTS }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.MAC_CERTS_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NXCORE_AGENT_RUNTIME: ${{ vars.NXCORE_AGENT_RUNTIME }}
      NXCORE_SAAS_API_URL: ${{ vars.NXCORE_SAAS_API_URL }}
      NXCORE_KNOWLEDGE_ROUTER_ENABLED: ${{ vars.NXCORE_KNOWLEDGE_ROUTER_ENABLED }}
      NXCORE_KNOWLEDGE_INGEST_DEBOUNCE_MS: ${{ vars.NXCORE_KNOWLEDGE_INGEST_DEBOUNCE_MS }}
      NXCORE_CONNECTOR_POLL_MS: ${{ vars.NXCORE_CONNECTOR_POLL_MS }}
      NXCORE_INGEST_FILTER_ENABLED: ${{ vars.NXCORE_INGEST_FILTER_ENABLED }}
      NXCORE_INGEST_FILTER_MODE: ${{ vars.NXCORE_INGEST_FILTER_MODE }}
      NXCORE_NANGO_URL: ${{ secrets.NXCORE_NANGO_URL }}
      NXCORE_NANGO_SECRET: ${{ secrets.NXCORE_NANGO_SECRET }}
      NXCORE_NANGO_GMAIL_CONFIG_KEY: ${{ secrets.NXCORE_NANGO_GMAIL_CONFIG_KEY }}
      NXCORE_NANGO_GOOGLE_CLIENT_ID: ${{ secrets.NXCORE_NANGO_GOOGLE_CLIENT_ID }}
      NXCORE_NANGO_GOOGLE_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_GOOGLE_CLIENT_SECRET }}
      NXCORE_NANGO_NOTION_CLIENT_ID: ${{ secrets.NXCORE_NANGO_NOTION_CLIENT_ID }}
      NXCORE_NANGO_NOTION_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_NOTION_CLIENT_SECRET }}
      NXCORE_NANGO_OUTLOOK_CLIENT_ID: ${{ secrets.NXCORE_NANGO_OUTLOOK_CLIENT_ID }}
      NXCORE_NANGO_OUTLOOK_CLIENT_SECRET: ${{ secrets.NXCORE_NANGO_OUTLOOK_CLIENT_SECRET }}
      NXCORE_NANGO_OUTLOOK_CONFIG_KEY: ${{ secrets.NXCORE_NANGO_OUTLOOK_CONFIG_KEY }}
      NXCORE_BROWSER_EXTENSION_STORE_URL: ${{ vars.NXCORE_BROWSER_EXTENSION_STORE_URL }}
      NXCORE_BROWSER_EXTENSION_ID: ${{ vars.NXCORE_BROWSER_EXTENSION_ID }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          # Include the Nango submodule lockfile: the pnpm store is shared with
          # the staging `pnpm install` in prepare-nango-runtime.mjs, whose deps
          # are not covered by the root lockfile. Without this, the store cache
          # key never changes when those deps change, the exact-key hit skips
          # the post-job save, and the staging deps re-download every run.
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/gateway/src/modules/connector/package-lock.json

      - name: Validate release tag
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [[ "$GITHUB_REF_NAME" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+)(-nightly\.[0-9]{8}\.[0-9]+)?$ ]] || {
            echo "Tag $GITHUB_REF_NAME is not a desktop release tag" >&2
            exit 1
          }
          test "${BASH_REMATCH[1]}" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match desktop version $version" >&2
            exit 1
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tagged commit must be on main" >&2
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tarball cache for the `npm ci` runs inside prepare-nango-runtime.mjs
      # (Nango submodule) and prepare-genoffice-runtime.mjs (genoffice
      # submodule). The pnpm store above only covers pnpm installs.
      - name: Cache npm tarballs for submodule builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-tarballs-${{ runner.os }}-${{ hashFiles('apps/gateway/src/modules/connector/package-lock.json', 'apps/desktop/vendor/genoffice/package-lock.json') }}
          restore-keys: npm-tarballs-${{ runner.os }}-

      # prepare-genoffice-runtime.mjs builds the Rust xlsx sidecar (cargo
      # build --release); rust-cache covers the registry and target dir.
      - name: Cache Rust build for xlsx sidecar
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: apps/desktop/vendor/genoffice/apps/sheets/native/xlsx-engine

      - name: Check types
        run: pnpm typecheck

      - name: Prepare macOS signing assets
        shell: bash
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            echo "::warning::macOS signing certificate is not configured; producing an unsigned build."
            exit 0
          fi
          test -n "$CSC_KEY_PASSWORD"
          if [[ -z "$MACOS_PROVISIONING_PROFILE_BASE64" ]]; then
            echo "::warning::APNs provisioning profile is not configured; push entitlements will not be verified."
            exit 0
          fi
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > apps/desktop/build/embedded.provisionprofile
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          security cms -D -i apps/desktop/build/embedded.provisionprofile > "$RUNNER_TEMP/everroom-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/everroom-profile.plist" | grep -E '^.+\.com\.nxcore\.ce$'
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.aps-environment' "$RUNNER_TEMP/everroom-profile.plist" | grep -Fx production

      - name: Build app and bundled runtimes
        run: |
          pnpm build
          pnpm --filter @nxcore/desktop exec node scripts/prepare-open-connector.mjs
          pnpm --filter @nxcore/desktop exec node scripts/prepare-oo-cli.mjs
          pnpm --filter @nxcore/desktop exec node scripts/generate-packaged-env.mjs
          test -f apps/desktop/build/nango-runtime/packages/server/dist/server.js

      - name: Package macOS arm64
        shell: bash
        run: |
          # osx-sign walks the whole .app with unbounded concurrency; default
          # 256 fd limit on runners causes EMFILE on the bundled node_modules.
          ulimit -n 10240
          args=()
          if [[ -n "$CSC_LINK" ]]; then
            args+=(--config.mac.notarize=true --config.mac.hardenedRuntime=true)
            profile="apps/desktop/build/embedded.provisionprofile"
            if [[ -f "$profile" ]]; then
              # Absolute path: osx-sign passes it verbatim to `security cms`,
              # which resolves relative paths against its own cwd.
              args+=("--config.mac.provisioningProfile=$(pwd)/$profile")
            else
              # Without a profile, aps-environment is an unauthorized restricted
              # entitlement and AMFI kills the app at launch. Ship without push.
              /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.aps-environment' apps/desktop/build/entitlements.mac.plist
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm --filter @nxcore/desktop exec electron-builder --mac dmg zip --arm64 --publish never "${args[@]}"

      - name: Audit package contents
        shell: bash
        run: |
          app_path="$(find release -type d -name EverRoom.app -print -quit)"
          test -n "$app_path" || { echo "EverRoom.app was not produced" >&2; exit 1; }
          resources="$app_path/Contents/Resources"
          forbidden='(^|/)(\.env($|\.)|(__tests__|tests?)(/|$)|[^/]*(\.test|\.spec)\.[^/]+$|(test|spec)\.[^/]+$)|\.map$'

          # nango/ ships a vendored runtime whose compiled dist imports
          # *.test.js and whose node_modules contains test fixtures — both
          # required at runtime, so it is exempt from the loose-file audit.
          loose_files="$(find "$resources" -type f -not -path "$resources/nango/*" -print)"
          if printf '%s\n' "$loose_files" | grep -Eiq "$forbidden"; then
            printf '%s\n' "$loose_files" | grep -Ei "$forbidden" >&2
            exit 1
          fi
          nango_loose="$(find "$resources/nango" -type f -print)"
          printf '%s\n' "$nango_loose" | grep -Eiq '\.env($|\.)' && { printf '%s\n' "$nango_loose" | grep -Ei '\.env($|\.)' >&2; exit 1; }
          printf '%s\n' "$nango_loose" | grep -Ei '\.(map|ts|tsx|mts|cts)$' && { printf '%s\n' "$nango_loose" | grep -Ei '\.(map|ts|tsx|mts|cts)$' >&2; exit 1; }
          unexpected_typescript="$(printf '%s\n' "$loose_files" | grep -Ei '\.(ts|tsx|mts|cts)$' | grep -Ev "^$resources/open-connector/" || true)"
          test -z "$unexpected_typescript" || { printf '%s\n' "$unexpected_typescript" >&2; exit 1; }

          asar_path="$(cd "$resources" && pwd)/app.asar"
          pnpm --filter @nxcore/desktop exec asar list "$asar_path" > "$RUNNER_TEMP/asar-files.txt"
          if grep -Eiq "$forbidden" "$RUNNER_TEMP/asar-files.txt"; then
            grep -Ei "$forbidden" "$RUNNER_TEMP/asar-files.txt" >&2
            exit 1
          fi
          unexpected_typescript="$(grep -Ei '\.(ts|tsx|mts|cts)$' "$RUNNER_TEMP/asar-files.txt" | grep -Eiv '[\\/]node_modules[\\/]@tencentdb-agent-memory[\\/](memory-tencentdb-v2|knowledge-service)[\\/]src[\\/]' || true)"
          test -z "$unexpected_typescript" || { printf '%s\n' "$unexpected_typescript" >&2; exit 1; }

          grep -Fq 'memory-tencentdb-v2/bin/memory-gateway.mjs' "$RUNNER_TEMP/asar-files.txt"
          grep -Fq 'memory-tencentdb-v2/src/gateway/server.ts' "$RUNNER_TEMP/asar-files.txt"
          grep -Fq 'knowledge-service/src/server.ts' "$RUNNER_TEMP/asar-files.txt"
          grep -Fq '@node-rs/jieba-darwin-arm64' "$RUNNER_TEMP/asar-files.txt"
          grep -Fq '@colbymchenry/codegraph-darwin-arm64' "$RUNNER_TEMP/asar-files.txt"
          test -x "$resources/app.asar.unpacked/node_modules/@esbuild/darwin-arm64/bin/esbuild"
          test -f "$resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/darwin-arm64.node"
          test -f "$resources/open-connector/src/server/index.ts"
          test -f "$resources/nango/packages/server/dist/server.js"
          test -f "$resources/open-connector/dist/web/index.html"
          test -x "$resources/oo/darwin-arm64/oo"
          "$resources/oo/darwin-arm64/oo" --version

      - name: Verify artifacts
        shell: bash
        run: |
          app_path="$(find release -type d -name EverRoom.app -print -quit)"
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          test "${#dmgs[@]}" -eq 1 && test -f "${dmgs[0]}" || { echo "Expected one DMG" >&2; exit 1; }
          test "${#zips[@]}" -eq 1 && test -f "${zips[0]}" || { echo "Expected one ZIP" >&2; exit 1; }
          test "$(lipo -archs "$app_path/Contents/MacOS/EverRoom")" = "arm64"
          test -f "$app_path/Contents/Resources/gateway/node_modules/better-sqlite3/prebuilds/darwin-arm64.node"
          hdiutil verify "${dmgs[0]}"
          unzip -t "${zips[0]}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-assets
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: [macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-assets
          path: release-assets

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 || secrets.MAC_CERTS }}
          PUSH_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          expected=(
            "release-assets/EverRoom-$version-arm64.dmg"
            "release-assets/EverRoom-$version-arm64.zip"
          )
          files=(release-assets/*)
          test "${#files[@]}" -eq "${#expected[@]}" || {
            printf 'Unexpected release assets:\n%s\n' "${files[*]}" >&2
            exit 1
          }
          for asset in "${expected[@]}"; do
            test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          if [[ -n "$SIGNING_CERTIFICATE" ]]; then
            notes="Signed and notarized Apple Silicon builds."
            if [[ -n "$PUSH_PROFILE" ]]; then
              notes="Signed and notarized Apple Silicon builds with macOS push notification support."
            fi
          else
            notes="Unsigned Apple Silicon development builds. macOS Gatekeeper may require manual approval before first launch."
          fi
          gh release create "$GITHUB_REF_NAME" "${expected[@]}" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes "$notes"

  notify:
    needs: [macos, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Notify Feishu
        shell: bash
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [[ -z "$FEISHU_WEBHOOK_URL" ]]; then
            echo "::warning::FEISHU_RELEASE_WEBHOOK is not configured; skipping notification."
            exit 0
          fi

          previous_tag="$(git describe --tags --match 'desktop-v*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commits="$(git log --no-merges --pretty='- %h %s (%an)' "$previous_tag..$GITHUB_SHA" -n 20)"
          else
            commits="$(git log --no-merges --pretty='- %h %s (%an)' "$GITHUB_SHA" -n 20)"
          fi
          [[ -n "$commits" ]] || commits="- 本版本仅包含合并提交"

          if [[ "$PUBLISH_RESULT" == "success" ]]; then
            status="成功"
            target="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          else
            status="失败"
            target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

          message="EverRoom 桌面端发布$status
          版本：$GITHUB_REF_NAME
          提交：
          $commits
          地址：$target"
          payload="$(jq -n --arg text "$message" '{msg_type:"text",content:{text:$text}}')"
          response="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$FEISHU_WEBHOOK_URL")"
          code="$(jq -r '.code // .StatusCode // -1' <<< "$response")"
          test "$code" = "0" || {
            echo "Feishu rejected the notification with code $code" >&2
            exit 1
          }
