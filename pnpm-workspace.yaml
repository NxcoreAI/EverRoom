packages:
  - "apps/*"
  - "packages/*"
  - "submodules/everoffice-connectors/gateway-module"
  - "submodules/everoffice-connectors/connector-contract"

# electron-vite 从 .pnpm store 路径 require.resolve('electron/package.json')，
# 需要根 node_modules 有 electron 链接（pnpm 11 默认不再把它挂进隐藏 hoist 层）。
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - electron

overrides:
  "app-builder-lib>@electron/get": "3.1.0"
  "better-sqlite3": "13.0.3"

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': false
  '@sentry/cli': true
  '@oomol-lab/open-connector@git+https://github.com/NxcoreAI/open-connector.git#806663488c6e8df92755d473cd866a1d80f2222f': false
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  '@larksuite/cli': true
  ntn: true
  '@oomol-lab/open-connector@https://codeload.github.com/NxcoreAI/open-connector/tar.gz/806663488c6e8df92755d473cd866a1d80f2222f(patch_hash=9bcac830536dc50bbfc27c3960faaad12c3b6ae839bb8357b1a3c21027c40c14)': false
  '@oomol-lab/open-connector@https://codeload.github.com/NxcoreAI/open-connector/tar.gz/806663488c6e8df92755d473cd866a1d80f2222f(patch_hash=f90e970ad42a7c6736648c3bb490efc5c9b507f7470746c62236ee7d6dbb9418)': false
  # 记忆库的 postinstall 只做「修复已 opt-in 的 Codex shim + 打印安装提示」，
  # 产品内嵌用不到，显式拒绝执行（供应链最小权限）。
  hippo-memory: false

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.84.2'
  - '@earendil-works/pi-ai@0.84.2'
  - '@earendil-works/pi-client@0.84.2'
  - '@earendil-works/pi-coding-agent@0.84.2'
  - '@earendil-works/pi-protocol@0.84.2'
  - '@earendil-works/pi-telemetry@0.84.2'
  - '@earendil-works/pi-tui@0.84.2'
  - ntn@0.23.1

patchedDependencies:
  '@electron/osx-sign@1.3.3': patches/@electron__osx-sign@1.3.3.patch
  '@oomol-lab/open-connector@0.0.0-development': patches/@oomol-lab__open-connector@0.0.0-development.patch
  pi-mcp-adapter@2.26.1: patches/pi-mcp-adapter@2.26.1.patch
