packages:
  - "apps/*"
  - "packages/*"

# electron-vite 从 .pnpm store 路径 require.resolve('electron/package.json')，
# 需要根 node_modules 有 electron 链接（pnpm 11 默认不再把它挂进隐藏 hoist 层）。
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - electron

overrides:
  "app-builder-lib>@electron/get": "3.1.0"
  "better-sqlite3": "13.0.3"

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': false
  '@sentry/cli': true
  '@oomol-lab/open-connector@https://codeload.github.com/oomol-lab/open-connector/tar.gz/5719a69468c698c7cb8108e062ff64ecef8a2e65': false
  '@tencentdb-agent-memory/memory-tencentdb-v2@git+https://github.com/NxcoreAI/TencentDB-Agent-Memory.git#f65f83e550cc4a13d51cbef8550f0b1755073ea4&path:MemoryCore': false
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  '@tencentdb-agent-memory/memory-tencentdb-v2@git+https://github.com/NxcoreAI/TencentDB-Agent-Memory.git#f65f83e550cc4a13d51cbef8550f0b1755073ea4&path:MemoryCore(patch_hash=351b45cf8e7bc7b80b1feff362fb4100900a4301b00d7dd3fa34c572f331e7e6)': false
  '@larksuite/cli': true

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.84.2'
  - '@earendil-works/pi-ai@0.84.2'
  - '@earendil-works/pi-client@0.84.2'
  - '@earendil-works/pi-coding-agent@0.84.2'
  - '@earendil-works/pi-protocol@0.84.2'
  - '@earendil-works/pi-telemetry@0.84.2'
  - '@earendil-works/pi-tui@0.84.2'

patchedDependencies:
  '@electron/osx-sign@1.3.3': patches/@electron__osx-sign@1.3.3.patch
  '@tencentdb-agent-memory/memory-tencentdb-v2@2.0.0-beta.1-everroom.8': patches/memory-tencentdb-v2@2.0.0-beta.1-everroom.8.patch
  pi-mcp-adapter@2.26.1: patches/pi-mcp-adapter@2.26.1.patch
  sqlite-vec@0.1.7-alpha.2: patches/sqlite-vec@0.1.7-alpha.2.patch
