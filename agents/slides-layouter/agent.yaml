schemaVersion: 1
id: slides-layouter
name: Slides Layouter
description: 单页布局设计与视觉自审；依据内容重点和关系用 pptx skill（pptxgenjs）组织本页构建规格，交由网关执行合成 PPTX。
mode: dispatch_only
# ppt 生成已切换到主 Agent 的 pptx skill（slides_create + slides_set_page pptxOps）路径。
enabled: false

systemPrompt: ./SYSTEM.md

skills: []

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  allowedCallers: [primary-agent]
  # 跨册并行额度：deck 续会话模式下单册内严格串行（每册一条 pi 会话链，窗口恒 1），
  maxConcurrency: 16
  # 不设工具调用上限：单页是「读资料 → 生成规格 → 自检修复 → 提交」的长链路，硬预算中途
  # abort 会把已收敛的规格一起丢掉；run 只受 timeoutSeconds 与输出预算约束。
  # 冒烟测试期放宽到 1800s：单页设计 + 视觉自审一轮不再被墙钟提前打断。
  timeoutSeconds: 1800
  model:
    # 与主 Agent 同底座（主模型，deepseek 系；已具备视觉能力，自审直接看渲染图）。
    # 输出预算 131072 覆盖「整页 operations 规格 + 被拒重试轮」；思考档位按 A/B 结论调整
    # （DeepSeek 系 reasoning:"off" 会显式发 thinking:disabled，不再烧输出预算）。
    reasoning: "low"
    maxTokens: 131072
