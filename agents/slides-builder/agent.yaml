schemaVersion: 1
id: slides-builder
name: Slides Builder
description: 承接 EverRoom 演示文稿（PPT）的修改——按指令读取既有 deck 大纲并发编辑事务（整页重排走 set_page spec 形态），保持全篇风格一致
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills: []

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  allowedCallers: [primary-agent]
  maxConcurrency: 2
  # edit 事务：read + edit 若干 + 失败重试 + 提交。
  maxToolCalls: 48
  timeoutSeconds: 1800
  model:
    # builder 走 background 档，未显式声明会继承 8192 输出上限：多条编辑事务的
    # JSON 一旦打满就被判 length 失败，这里显式给足（与 planner/layouter 同档）。
    maxTokens: 32768
