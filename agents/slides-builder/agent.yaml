schemaVersion: 1
id: slides-builder
name: Slides Builder
description: 承接 EverRoom 演示文稿（PPT）的修改——按指令读取既有 deck 大纲并发编辑事务（整页重排走 set_page spec 形态），保持全篇风格一致
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills: []

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  allowedCallers: [primary-agent]
  maxConcurrency: 2
  # edit 预算：read + edit 事务若干 + 失败重试 + 提交。
  maxToolCalls: 48
  timeoutSeconds: 900
