schemaVersion: 1
id: slides-planner
name: Slides Planner
description: 承接演示文稿（PPT）create 的方案阶段——收集背景与素材、产出逐页内容大纲，交由 slides-builder 落页
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills: []

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  allowedCallers: [primary-agent]
  maxConcurrency: 2
  # 方案阶段预算：素材检索 + 文档读取 + 大纲撰写，不落页。
  maxToolCalls: 32
  timeoutSeconds: 420
