schemaVersion: 1
id: slides-planner
name: Slides Planner
description: 承接演示文稿（PPT）的两段方案工作——draft 产出内容草稿供用户确认，arrange 把确认稿编排成带密度节奏与配图的落页方案，交由 slides-builder 落页
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills: []

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  allowedCallers: [primary-agent]
  # 分批编排时一册 deck 最多 2 批在飞；留到 4 让两册并发也排队而不被硬拒。
  maxConcurrency: 4
  # 不设工具调用上限：planner 是「读资料 → 成稿 → 提交」的长链路，硬预算中途 abort
  # 会把已收敛的方案一起丢掉（历史 40/80 次上限都打穿过）；run 只受 timeoutSeconds
  # 与输出预算约束。
  # 冒烟测试期放宽单次墙钟：整册 draft 与 ≤8 页单批 arrange 都吃这一档。
  timeoutSeconds: 1800
  model:
    # planner 是「整册长文一次成稿」：思考档固定关掉，输出上限显式给足。
    # 27 页实测 submit 参数约 7k token、32 页按 1~2 万 token 估算，32768 足够覆盖整册；
    # 再高（如 65k）会与 128k 上下文窗口和 pi 的 16k 压缩预留互相挤压。
    # 不写这两项会继承 background 档：用户槽位只存 model 时容易回落到 8192 输出上限。
    reasoning: "off"
    maxTokens: 32768
