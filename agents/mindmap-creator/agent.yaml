schemaVersion: 1
id: mindmap-creator
name: Mindmap Creator
description: 以单篇文档或 Room 全部文档为输入，生成 NotebookLM 式三层思维导图，经 subagent_submit_result 提交严格 JSON 树
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills:
  - ./skills/mindmap

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  # 仅网关内部工作流（聚焦思维导图生成）可调；主 Agent 与桌面端不可直调。
  allowedCallers: [internal-workflow]
  maxConcurrency: 2
  timeoutSeconds: 300
  # 素材由网关完整注入，无自取需求；预算留给 skill read 与 subagent_submit_result。
  maxToolCalls: 4
