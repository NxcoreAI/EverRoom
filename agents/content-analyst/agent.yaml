schemaVersion: 1
id: content-analyst
name: Content Analyst
description: 分析调用方提供的材料，提取事实、观点、风险、缺口和可执行结论
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills:
  - ./skills/analysis-method

mcp: []

inputSchema: ./schemas/input.schema.json

policy:
  allowedCallers: [primary-agent, internal-workflow]
  # 4 并发（2026-09-04）：主 Agent 并行投喂多文件 + doc-writer 研究工具也会派发
  # content_analysis，2 槽在并行调用簇下秒满并硬拒（框架无排队）。
  maxConcurrency: 4
  timeoutSeconds: 180
  maxToolCalls: 8
