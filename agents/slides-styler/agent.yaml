schemaVersion: 1
id: slides-styler
name: Slides Styler
description: 无模板幻灯片的视觉设计判断：direction 提供 3 个可比较的纵览图生图方向；settle 复核色板与视觉属性，提交完整风格参数及效果说明。字号由下游负责。
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills: []

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  allowedCallers: [primary-agent]
  maxConcurrency: 2
  # 纯文本判断，无工具调用预算需求；给少量余量容纳重试。
  maxToolCalls: 8
  timeoutSeconds: 600
  model:
    # styler 同样走 background 档：风格卡 + 效果说明的 JSON 显式给足输出上限，
    # 避免 8192 打满后被判 length 失败。
    maxTokens: 32768
