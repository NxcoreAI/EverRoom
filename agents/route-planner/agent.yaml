schemaVersion: 1
id: route-planner
name: Route Planner
description: 以新文档标题（或附用户描述）与 Room 关系三图谱素材为输入，为写作路线导图逐层生成候选路线（全图最多四层：第二层 3-5 条差异化路线选择，深层 2-3 条深化选项），经 subagent_submit_result 提交严格 JSON
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills:
  - ./skills/route-planning

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  # 仅网关内部工作流（写作路线导图生成）可调；主 Agent 与桌面端不可直调。
  allowedCallers: [internal-workflow]
  maxConcurrency: 2
  timeoutSeconds: 300
  # 素材由网关完整注入，无自取需求；预算留给 skill read 与 subagent_submit_result。
  maxToolCalls: 4
